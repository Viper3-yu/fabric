# 迹信生产部署反向代理示例。
#
# 用法（Linux 服务器，域名 example.com，证书已就位）：
#   1. pnpm build                  # 产物在 apps/web/dist
#   2. 构建并运行 Go API（见 deploy/README.md 的 systemd 单元）
#   3. sudo cp deploy/nginx.conf /etc/nginx/sites-available/jixin
#      sudo ln -s /etc/nginx/sites-available/jixin /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# 架构：Nginx 终止 TLS，托管前端静态文件，把 /api 转发给本机 Go API。
# 同源部署让 httpOnly 会话 cookie 自然工作，无需跨域配置。

limit_req_zone $binary_remote_addr zone=jixin_public:10m rate=20r/m;

upstream jixin_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 证书签发期可临时保留 80 的 ACME 验证；上线后强制跳转 HTTPS。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 安全响应头。前端是纯静态 SPA，不需要 frame/嵌入。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 前端静态资源（pnpm build 产物） ----
    root /opt/jixin/web;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA 路由回退：/track、/verify、/app/* 都要返回 index.html。
        try_files $uri $uri/ /index.html;
    }

    # ---- Go API ----
    location /api/ {
        limit_req zone=jixin_public burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://jixin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fabric 提交最长可等 ~80s，代理超时要高于 API 的 WriteTimeout(100s)。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1m;
    }
}
