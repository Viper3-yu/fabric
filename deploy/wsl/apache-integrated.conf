<VirtualHost *:8181>
    ServerName localhost
    DocumentRoot /var/www/jixin-integrated

    ProxyPreserveHost On
    <Location />
        Require local
    </Location>
    ProxyPass        /api/ http://127.0.0.1:3001/api/ timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/
    ProxyPass        /lianyun-api/ http://127.0.0.1:8080/api/ timeout=120
    ProxyPassReverse /lianyun-api/ http://127.0.0.1:8080/api/
    ProxyPass        /lianyun-org2-api/ http://127.0.0.1:8082/api/ timeout=120
    ProxyPassReverse /lianyun-org2-api/ http://127.0.0.1:8082/api/

    <Directory /var/www/jixin-integrated>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <LocationMatch "^/(api|lianyun-api|lianyun-org2-api)/">
        FallbackResource disabled
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "DENY"

    ErrorLog ${APACHE_LOG_DIR}/jixin-integrated-error.log
    CustomLog ${APACHE_LOG_DIR}/jixin-integrated-access.log combined
</VirtualHost>
